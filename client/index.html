<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>moovmii — Transit Kiosk</title>
    <meta name="description" content="Real-time NYC subway arrivals, weather forecasts, and clock display optimized for kiosk screens" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Kiosk self-heal: if the app bundle failed to boot (e.g. a reload raced
      // a deploy and the assets 404'd), keep retrying — unattended devices
      // must never stay stuck on a blank screen
      setTimeout(function retryIfBlank() {
        var root = document.getElementById("root");
        if (!root || root.childElementCount === 0) location.reload();
      }, 20000);
    </script>
  </body>
</html>
